<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">StackSignal</title>
  <desc id="desc">Engineering intelligence, from silicon to tokens. A dark banner with a blue layered StackSignal mark and subtle concentric signal rings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101722"/><stop offset="1" stop-color="#17283b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b8d5ff"/><stop offset="1" stop-color="#77cbbb"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a9c9f7" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <g fill="none" stroke="#a9c9f7" stroke-opacity=".09">
    <circle cx="1080" cy="190" r="105"/><circle cx="1080" cy="190" r="160"/><circle cx="1080" cy="190" r="215"/>
  </g>
  <g transform="translate(70 85)" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <path d="m0 36 48-28 48 28-48 28Z"/><path d="m0 62 48 28 48-28M0 88l48 28 48-28"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="198" y="159" fill="#f0f4fa" font-size="72" font-weight="700" letter-spacing="-3">StackSignal</text>
    <text x="200" y="205" fill="#adc3df" font-size="27">Engineering intelligence, from silicon to tokens.</text>
    <text x="72" y="291" fill="#c4d3e6" font-size="24" letter-spacing="1.5">DISCOVER</text>
    <circle cx="223" cy="283" r="3" fill="#77cbbb"/>
    <text x="248" y="291" fill="#c4d3e6" font-size="24" letter-spacing="1.5">UNDERSTAND</text>
    <circle cx="446" cy="283" r="3" fill="#77cbbb"/>
    <text x="471" y="291" fill="#c4d3e6" font-size="24" letter-spacing="1.5">BUILD KNOWLEDGE</text>
  </g>
  <rect x="72" y="233" width="625" height="2" rx="1" fill="url(#accent)" opacity=".4"/>
</svg>
