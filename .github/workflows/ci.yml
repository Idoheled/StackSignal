name: CI and Cloudflare

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      operation:
        description: Manual quality or guarded WhatsApp maintenance; no provisioning
        type: choice
        default: quality
        options: [quality, whatsapp_pairing]

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'
  WRANGLER_WRITE_LOGS: 'false'
  CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'

jobs:
  quality:
    name: Quality
    if: github.event_name != 'workflow_dispatch' || inputs.operation != 'whatsapp_pairing'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: quality-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - run: pnpm typecheck
      - run: pnpm typecheck:collector
      - run: pnpm test
      - run: python3 tests/oci-preflight.test.py
      - run: python3 tests/oci-host.test.py
      - run: python3 tests/oci-runner.test.py
      - run: python3 tests/whatsapp-pairing-runner.test.py
      - run: python3 tests/whatsapp-delivery-config.test.py
      - run: pnpm build:standalone
      - run: node scripts/verify-client-boundary.mjs
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:browser
      - name: Save browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failures-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 3
          if-no-files-found: ignore
      - name: Save verified build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-${{ github.sha }}
          path: dist/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  whatsapp_pairing:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'whatsapp_pairing' && github.actor == 'Idoheled' && (github.ref == 'refs/heads/feat/whatsapp-notifications' || github.ref == 'refs/heads/dev') && github.repository == 'Idoheled/StackSignal'
    uses: ./.github/workflows/whatsapp-maintenance.yml
    secrets: inherit

  deploy:
    name: Production
    needs: quality
    if: github.repository == 'Idoheled/StackSignal' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://stacksignal.stacksignal-idoheled.workers.dev
    concurrency:
      group: stacksignal-production
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-${{ github.sha }}
          path: dist/
      - name: Deploy the verified artifact
        run: pnpm deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 49c94d7ba2a9124b3e0ddea7a329ad05
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm smoke:production

  release:
    name: GitHub Release
    needs: [quality, deploy]
    if: github.repository == 'Idoheled/StackSignal' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: stacksignal-releases
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Publish the version after verified production deployment
        run: node scripts/release.mjs publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          PRODUCTION_RESULT: ${{ needs.deploy.result }}
